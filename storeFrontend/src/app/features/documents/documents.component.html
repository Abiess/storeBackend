<div class="documents-page">
  <app-page-header
    [title]="'documents.title' | translate"
    [subtitle]="'documents.subtitle' | translate"
    [showBackButton]="true"
  ></app-page-header>

  <!-- Faktortest App-Factory: generische App-Navigation (inkl. "Apps wechseln"),
       nur eigene DOCUMENTS_NAV_CONFIG. GLOBAL-Scope -> kein ContextSelector. -->
  <app-navigation [config]="navConfig"></app-navigation>

  <!-- Mobile-first Quick Actions: große Touch-Ziele, Kamera/Datei/Manuell leicht erreichbar. -->
  <div class="doc-quick-actions">
    <button mat-raised-button color="primary" class="doc-quick-btn" (click)="takePhoto()">
      <mat-icon>photo_camera</mat-icon>
      {{ 'documents.actions.takePhoto' | translate }}
    </button>
    <button mat-stroked-button class="doc-quick-btn" (click)="uploadFile()">
      <mat-icon>upload_file</mat-icon>
      {{ 'documents.actions.uploadFile' | translate }}
    </button>
    <button mat-stroked-button class="doc-quick-btn" (click)="createManual()">
      <mat-icon>add_circle_outline</mat-icon>
      {{ 'documents.actions.createManual' | translate }}
    </button>
    <!-- Verstecktes Kamera-Input: takePhoto() klickt es DIREKT an (kein Zwischen-Dialog mehr).
         capture="environment" ist HIER (im Gegensatz zum generischen "Datei hochladen"-Input
         im Dialog) bewusst gesetzt, damit iPhone/Android möglichst direkt die Rückkamera statt
         eines Auswahl-Dialogs (Kamera/Galerie) öffnen. Das ist sicher, weil onCameraFileSelected()
         die Datei SOFORT via DocumentsService.materializeFile() (arrayBuffer()-Fix) materialisiert,
         BEVOR der Dialog überhaupt geöffnet wird - der ursprüngliche 500er kam nicht vom
         capture-Attribut selbst, sondern davon, dass das *ngIf-Input im Dialog verschwand,
         während der User noch das Formular ausfüllte, und der iOS-Blob dabei ephemer war. -->
    <input
      #cameraFileInput
      type="file"
      accept="image/*"
      capture="environment"
      (change)="onCameraFileSelected($event)"
      style="display: none;">
  </div>

  <!-- Tabs: Meine Dokumente / Mit mir geteilt -->
  <div class="doc-tabs" role="tablist">
    <button
      type="button"
      role="tab"
      class="doc-tab"
      [class.active]="activeTab === 'mine'"
      [attr.aria-selected]="activeTab === 'mine'"
      (click)="setTab('mine')">
      {{ 'documents.tabs.mine' | translate }} ({{ mineDocuments.length }})
    </button>
    <button
      type="button"
      role="tab"
      class="doc-tab"
      [class.active]="activeTab === 'shared'"
      [attr.aria-selected]="activeTab === 'shared'"
      (click)="setTab('shared')">
      {{ 'documents.tabs.shared' | translate }} ({{ sharedDocuments.length }})
    </button>
  </div>

  <!-- Zentrale, projektweite Liste (Karten auf Mobile, Tabelle möglich auf Desktop) -->
  <app-responsive-data-list
    [items]="visibleDocuments"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading"
    [rowClickable]="true"
    [searchPlaceholder]="'documents.searchPlaceholder' | translate"
    emptyIcon="📄"
    [emptyMessage]="(activeTab === 'mine' ? 'documents.empty.mine' : 'documents.empty.shared') | translate"
    (rowClick)="openDetail($event)">
  </app-responsive-data-list>
</div>
