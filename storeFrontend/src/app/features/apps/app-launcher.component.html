<div class="app-launcher">
  <h1 class="app-launcher__title">{{ 'apps.launcher.title' | translate }}</h1>
  <p class="app-launcher__subtitle">{{ 'apps.launcher.subtitle' | translate }}</p>

  <div class="app-launcher__grid">
    <button
      type="button"
      class="app-card"
      *ngFor="let entry of apps"
      [attr.aria-label]="(entry.titleKey | translate) + (entry.descriptionKey ? ', ' + (entry.descriptionKey | translate) : '')"
      (click)="open(entry)"
    >
      <span class="app-card__icon" aria-hidden="true">{{ entry.icon }}</span>
      <span class="app-card__title">{{ entry.titleKey | translate }}</span>
      <span class="app-card__description" *ngIf="entry.descriptionKey">
        {{ entry.descriptionKey | translate }}
      </span>
    </button>
  </div>
</div>
