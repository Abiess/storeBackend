name: Deploy Flutter Web Preview to VPS (Documents/Maritime/DHL)

# ──────────────────────────────────────────────────────────────────────────
# Phase 2 – Flutter Web Preview Deployment (Multi-App, siehe Audit vom
# 22.09., DHL ergaenzt am 23.09.).
#
# EIN parametrisierter Workflow (kein Duplikat pro App): `workflow_dispatch`
# waehlt ueber den Input `app` (documents|maritime|dhl), welcher bestehende
# Entrypoint (`lib/entrypoints/main_<app>.dart`) gebaut und in welches
# eigene VPS-Zielverzeichnis deployt wird - siehe Step "Resolve app config"
# fuer den einzigen Mapping-Ort:
#   documents → lib/entrypoints/main_documents.dart → /var/www/flutter-dev.markt.ma
#   maritime  → lib/entrypoints/main_maritime.dart  → /var/www/maritime-dev.markt.ma
#   dhl       → lib/entrypoints/main_dhl.dart       → /var/www/dhl-dev.markt.ma
#
# Deployt AUSSCHLIESSLICH den statischen `flutter build web --release`
# Output in das jeweilige Zielverzeichnis auf dem bestehenden markt.ma VPS.
# Spiegelt bewusst das Backup-/Rollback-Muster aus deploy-frontend.yml
# (separates Zielverzeichnis pro App, KEIN Flutter-SDK auf dem VPS, Build
# ausschliesslich hier in GitHub Actions).
#
# Bewusst NICHT enthalten (siehe Aufgabenstellung, "noch kein automatischer
# Trigger" / "kein Nginx/DNS/Certbot"):
#   - kein automatischer push-Trigger (nur workflow_dispatch, manuell).
#   - keine Nginx-Installation/-Reload, kein Certbot, keine DNS-Aenderung
#     (siehe mobile-flutter-poc/nginx-flutter-dev-markt-ma.conf – nur
#     eingecheckt, noch nicht auf dem VPS aktiviert; fuer maritime-dev.markt.ma
#     und dhl-dev.markt.ma existiert noch KEINE Nginx-Konfiguration -
#     separater, spaeterer Schritt).
#   - keine Aenderung an /var/www/markt.ma/current (Angular bleibt unberuehrt).
#   - keine Aenderung an deploy.yml / deploy-frontend.yml.
#   - keine Backend-/CORS-Aenderung (https://*.markt.ma Wildcard-CORS deckt
#     beide Subdomains bereits ab, siehe WebConfig.java).
#   - kein Android-/iOS-Build (nur Web, siehe flutter-poc.yml fuer APK/Web-CI).
# ──────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Welche App deployen?'
        required: true
        type: choice
        options:
          - documents
          - maritime
          - dhl
        default: documents

# Zwei Deploys derselben Vorschau duerfen nicht gleichzeitig das aktuelle
# Verzeichnis austauschen. Verschiedene Apps koennen unabhaengig laufen.
concurrency:
  group: flutter-web-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter-poc

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Resolve app config (entrypoint + deploy target)
        # Einziger Mapping-Ort "app -> Entrypoint/Zielverzeichnis" - siehe
        # Multi-App-Audit vom 22.09. Bewusst fail-closed (exit 1) bei einer
        # unbekannten App, statt versehentlich in ein falsches/leeres
        # Zielverzeichnis zu deployen.
        id: app_config
        env:
          APP: ${{ inputs.app }}
        run: |
          case "$APP" in
            documents)
              echo "entrypoint=lib/entrypoints/main_documents.dart" >> "$GITHUB_OUTPUT"
              echo "deploy_dir=/var/www/flutter-dev.markt.ma" >> "$GITHUB_OUTPUT"
              echo "domain=flutter-dev.markt.ma" >> "$GITHUB_OUTPUT"
              ;;
            maritime)
              echo "entrypoint=lib/entrypoints/main_maritime.dart" >> "$GITHUB_OUTPUT"
              echo "deploy_dir=/var/www/maritime-dev.markt.ma" >> "$GITHUB_OUTPUT"
              echo "domain=maritime-dev.markt.ma" >> "$GITHUB_OUTPUT"
              ;;
            dhl)
              echo "entrypoint=lib/entrypoints/main_dhl.dart" >> "$GITHUB_OUTPUT"
              echo "deploy_dir=/var/www/dhl-dev.markt.ma" >> "$GITHUB_OUTPUT"
              echo "domain=dhl-dev.markt.ma" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "❌ Unbekannte app (erwartet: documents | maritime | dhl)"
              exit 1
              ;;
          esac

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Verify web/ exists (bootstrapped beforehand)
        run: |
          if [ ! -d "web" ]; then
            echo "❌ mobile-flutter-poc/web/ fehlt im Repo."
            echo "   Web-Platform muss zuerst einmalig via 'flutter create --platforms=web' bootstrapped werden."
            exit 1
          fi
          echo "✅ web/ vorhanden."

      - name: flutter pub get
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release -t ${{ steps.app_config.outputs.entrypoint }}

      - name: Verify web build exists
        run: |
          if [ ! -f "build/web/index.html" ]; then
            echo "❌ build/web/index.html nicht gefunden!"
            find build/web -type f || true
            exit 1
          fi
          echo "✅ Web-Build gefunden: $(du -sh build/web | cut -f1)"

      - name: Stamp deployed version
        run: printf '%s\n' '${{ github.sha }}' > build/web/version.txt

      - name: Create deployment package
        run: |
          cd build/web
          tar -czf ../../flutter-web-${{ github.run_id }}-dist.tar.gz .

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "mobile-flutter-poc/flutter-web-${{ github.run_id }}-dist.tar.gz"
          target: "/tmp/"
          strip_components: 1

      - name: Extract and setup on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_DIR: ${{ steps.app_config.outputs.deploy_dir }}
          DOMAIN: ${{ steps.app_config.outputs.domain }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Zielverzeichnis wird per env in die Remote-Shell durchgereicht
          # (siehe "Resolve app config") statt hartcodiert - dasselbe
          # Backup-/Rollback-/Cleanup-Verhalten wie bisher, nur pro App
          # in einem eigenen Verzeichnis (kein gegenseitiges Ueberschreiben).
          envs: DEPLOY_DIR,DOMAIN
          script: |
            echo "🚀 Deploying Flutter Web Preview to ${DOMAIN}..."
            echo "ℹ️  /var/www/markt.ma/current (Angular) wird NICHT beruehrt."
            echo "📍 Zielverzeichnis: ${DEPLOY_DIR}"

            # Create target directory if not exists (separates Verzeichnis pro App!)
            sudo mkdir -p "${DEPLOY_DIR}"

            # Backup old version
            if [ -d "${DEPLOY_DIR}/current" ]; then
              echo "📦 Backing up old version..."
              sudo mv "${DEPLOY_DIR}/current" "${DEPLOY_DIR}/backup-$(date +%Y%m%d-%H%M%S)" || true
            fi

            # Create new directory
            sudo mkdir -p "${DEPLOY_DIR}/current"

            # Extract new build
            echo "📂 Extracting new build..."
            sudo tar -xzf /tmp/flutter-web-${{ github.run_id }}-dist.tar.gz -C "${DEPLOY_DIR}/current"

            # Set permissions
            echo "🔒 Setting permissions..."
            sudo chown -R www-data:www-data "${DEPLOY_DIR}/current"
            sudo chmod -R 755 "${DEPLOY_DIR}/current"

            # Cleanup
            rm /tmp/flutter-web-${{ github.run_id }}-dist.tar.gz

            # Keep only last 3 backups (nur innerhalb des eigenen Zielverzeichnisses)
            cd "${DEPLOY_DIR}"
            sudo ls -t | grep backup | tail -n +4 | xargs -r sudo rm -rf || true

            echo "✅ Flutter Web Preview deployment complete!"
            echo "📍 Location: ${DEPLOY_DIR}/current"
            echo "⚠️  Nginx/DNS/Certbot sind NICHT Teil dieses Workflows -"
            echo "    siehe mobile-flutter-poc/nginx-flutter-dev-markt-ma.conf"
            echo "    fuer die noch manuell zu aktivierende Nginx-Konfiguration"
            echo "    (fuer maritime-dev.markt.ma und dhl-dev.markt.ma existiert"
            echo "    noch KEINE Nginx-Config)."

      - name: Deployment summary
        run: |
          echo "## 🎉 Flutter Web Preview Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 App: \`${{ inputs.app }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🔖 Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 Entrypoint: \`${{ steps.app_config.outputs.entrypoint }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Flutter Web (release) gebaut und auf VPS deployt" >> $GITHUB_STEP_SUMMARY
          echo "- 📍 Location: ${{ steps.app_config.outputs.deploy_dir }}/current" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Ziel-Domain (noch NICHT live): https://${{ steps.app_config.outputs.domain }}" >> $GITHUB_STEP_SUMMARY
          echo "- ℹ️  /var/www/markt.ma/current (Angular) wurde NICHT veraendert" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Noch manuell erforderlich (NICHT Teil dieses Workflows):" >> $GITHUB_STEP_SUMMARY
          echo "1. DNS A-Record fuer ${{ steps.app_config.outputs.domain }} → VPS-IP anlegen" >> $GITHUB_STEP_SUMMARY
          echo "2. Passende Nginx-Konfiguration auf dem VPS installieren (sites-available/sites-enabled)" >> $GITHUB_STEP_SUMMARY
          echo "3. SSL-Zertifikat erzeugen: sudo certbot --nginx -d ${{ steps.app_config.outputs.domain }}" >> $GITHUB_STEP_SUMMARY
          echo "4. sudo nginx -t && sudo systemctl reload nginx" >> $GITHUB_STEP_SUMMARY
