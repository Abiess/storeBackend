name: Build iOS TestFlight

# ──────────────────────────────────────────────────────────────────────────
# Mobile Factory M4 – signierter iOS-Build + Upload zu TestFlight.
#
# Analog zu build-android-apk.yml (M2.2), aber für iOS: statt eines
# unsignierten Debug-APKs als Artifact wird hier ein signiertes Release-
# Archiv erzeugt und automatisch zu App Store Connect / TestFlight
# hochgeladen (interne Verteilung, KEIN App-Store-Release).
#
# Ablauf:
#   Angular Production Build (storeFrontend)          – identisch zu Android
#   → Capacitor Sync iOS (bestehendes ios/-Projekt)    – identisch zu Android
#   → Xcode Archive (Release, manuelles Signing)
#   → Export als .ipa
#   → Upload zu App Store Connect via App Store Connect API Key
#   → TestFlight (interner Kreis, kein Release an "External Testers"/Store)
#
# Gemeinsame Codebasis (siehe ARCHITECTURE_APP_FACTORY.md §7j):
#   Gleicher Angular-Code, gleicher AuthService, gleicher StorageAdapter,
#   gleicher AppRegistry, gleiche Entitlements wie Web/Android. Dieser
#   Workflow baut NUR die native Hülle (ios/) neu und signiert sie – es
#   gibt kein separates iOS-Frontend und keine iOS-spezifische Business-
#   Logik.
#
# Bewusst NICHT enthalten:
#   - kein automatischer Trigger (nur workflow_dispatch, siehe unten)
#   - kein App-Store-Release, keine externe TestFlight-Freigabe
#   - keine Änderung an build-android-apk.yml / deploy.yml / deploy-frontend.yml
#   - keine hartcodierten Secrets/Zertifikate/Profile
#
# ──────────────────────────────────────────────────────────────────────────
# BENÖTIGTE GITHUB SECRETS (Repository-Settings → Secrets and variables →
# Actions), noch NICHT angelegt – dieser Workflow schlägt ohne sie
# kontrolliert mit einer klaren Fehlermeldung fehl (siehe "Preflight"-Step):
#
#   App Store Connect API Key (empfohlen statt persönlichem Apple-Passwort):
#     APP_STORE_CONNECT_KEY_ID        – Key-ID des API-Keys (App Store Connect
#                                        → Users and Access → Integrations →
#                                        App Store Connect API → Keys)
#     APP_STORE_CONNECT_ISSUER_ID     – Issuer-ID (gleiche Seite, oben)
#     APP_STORE_CONNECT_PRIVATE_KEY   – Inhalt der heruntergeladenen
#                                        AuthKey_<KEY_ID>.p8-Datei (roher
#                                        Text inkl. BEGIN/END PRIVATE KEY
#                                        Zeilen, NICHT base64-kodiert nötig)
#     APPLE_TEAM_ID                   – Apple Developer Team-ID (10-stellig,
#                                        developer.apple.com → Membership)
#
#   Signing (Distribution-Zertifikat + Provisioning Profile, siehe
#   "Signing/Provisioning-Strategie" unten):
#     IOS_DIST_CERTIFICATE_P12_BASE64 – base64-kodiertes .p12-Export des
#                                        "Apple Distribution"-Zertifikats
#                                        (inkl. privatem Schlüssel)
#     IOS_DIST_CERTIFICATE_P12_PASSWORD   – Passwort, das beim .p12-Export in
#                                        Keychain Access vergeben wurde
#     IOS_PROVISIONING_PROFILE_BASE64 – base64-kodiertes App-Store
#                                        ".mobileprovision"-Profil für
#                                        appId "ma.markt.app"
#     IOS_CI_KEYCHAIN_PASSWORD        – frei wählbares Passwort NUR für die
#                                        temporäre CI-Keychain (kein
#                                        Apple-Passwort, beliebiger Zufalls-
#                                        wert, z. B. via `openssl rand -hex 32`
#                                        einmalig erzeugt und als Secret
#                                        gespeichert)
#
#   base64-Kodierung lokal erzeugen:
#     macOS/Linux : base64 -i Distribution.p12 | pbcopy
#     Windows     : [Convert]::ToBase64String([IO.File]::ReadAllBytes("Distribution.p12")) | Set-Clipboard
#                   (identisch für AppStore.mobileprovision und die .p8-Datei,
#                   Dateiname jeweils anpassen. Siehe ARCHITECTURE_APP_FACTORY.md
#                   §7l für die vollständige Anleitung pro Secret.)
#
# SHARED XCODE SCHEME – bereits erledigt (siehe ARCHITECTURE_APP_FACTORY.md
#   §7l): `ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme` wurde
#   von Hand nach dem festen Capacitor-iOS-Template-UUID-Schema erzeugt und
#   ist im Repo committet. Ein Mac/Xcode war dafür NICHT nötig. Der
#   Preflight-Step prüft trotzdem weiterhin, dass die Datei vorhanden ist,
#   als Schutz gegen versehentliches Löschen/Verschieben.
# ──────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  build-testflight:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Node 22, identisch zur Begründung in build-android-apk.yml:
      # @capacitor/cli deklariert "engines.node": ">=22.0.0".
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: storeFrontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: storeFrontend
        run: npm ci --legacy-peer-deps

      - name: Build Angular app (production)
        working-directory: storeFrontend
        run: npm run build:prod

      - name: Capacitor sync (ios)
        working-directory: storeFrontend
        run: npx cap sync ios

      # Capacitor 8 / CapApp-SPM (Package.swift) verlangt swift-tools-version
      # 5.9 und iOS-Deployment-Target 15.0 (siehe project.pbxproj) → Xcode 15+
      # nötig. "latest-stable" verwendet die neueste auf dem macos-14-Runner
      # vorinstallierte stabile Xcode-Version; bei Bedarf hier auf eine
      # konkrete Version (z. B. "16.0") pinnen, sobald ein echter Testlauf
      # zeigt, welche Version tatsächlich benötigt/erwartet wird (App Store
      # Connect verlangt zeitweise ein Mindest-SDK, siehe Apple-Vorgaben).
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version (diagnostics)
        run: xcodebuild -version

      # ── Preflight: prüft, dass alle benötigten Secrets gesetzt sind UND
      # dass der Xcode-Scheme "App" als "shared" committet wurde, BEVOR
      # teure Signing-/Archive-Schritte versucht werden. Klare Fehlermeldung
      # statt kryptischem xcodebuild-Fehler.
      - name: Preflight – required secrets & shared scheme
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          IOS_DIST_CERTIFICATE_P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_CI_KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          missing=()
          [ -z "$APP_STORE_CONNECT_KEY_ID" ] && missing+=("APP_STORE_CONNECT_KEY_ID")
          [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ] && missing+=("APP_STORE_CONNECT_PRIVATE_KEY")
          [ -z "$APPLE_TEAM_ID" ] && missing+=("APPLE_TEAM_ID")
          [ -z "$IOS_DIST_CERTIFICATE_P12_BASE64" ] && missing+=("IOS_DIST_CERTIFICATE_P12_BASE64")
          [ -z "$IOS_DIST_CERTIFICATE_P12_PASSWORD" ] && missing+=("IOS_DIST_CERTIFICATE_P12_PASSWORD")
          [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] && missing+=("IOS_PROVISIONING_PROFILE_BASE64")
          [ -z "$IOS_CI_KEYCHAIN_PASSWORD" ] && missing+=("IOS_CI_KEYCHAIN_PASSWORD")

          if [ ${#missing[@]} -ne 0 ]; then
            echo "❌ Fehlende GitHub Secrets: ${missing[*]}"
            echo "   Siehe Kommentar-Header dieses Workflows bzw."
            echo "   ARCHITECTURE_APP_FACTORY.md §7k für die vollständige Liste"
            echo "   und Anleitung zur Beschaffung/Erzeugung."
            exit 1
          fi

          SCHEME_FILE="storeFrontend/ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme"
          if [ ! -f "$SCHEME_FILE" ]; then
            echo "❌ Shared Xcode-Scheme fehlt: $SCHEME_FILE"
            echo "   Einmalig auf einem Mac in Xcode: App.xcodeproj öffnen →"
            echo "   Product → Scheme → Manage Schemes → 'App' → Haken bei"
            echo "   'Shared' setzen → committen. Ohne diese Datei kann"
            echo "   xcodebuild den Scheme in CI nicht finden."
            exit 1
          fi

          echo "✅ Alle Secrets vorhanden, shared Scheme gefunden."

      # Temporäre, isolierte Keychain NUR für diesen CI-Lauf – wird am Ende
      # wieder gelöscht. Kein Zugriff auf/Veränderung der Runner-System-
      # Keychain über diesen Lauf hinaus.
      - name: Import distribution certificate into temporary keychain
        env:
          IOS_DIST_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          IOS_DIST_CERTIFICATE_P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_P12_PASSWORD }}
          IOS_CI_KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dist_certificate.p12"

          echo -n "$IOS_DIST_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$IOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERTIFICATE_P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$CERT_PATH"

      - name: Install App Store provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PROFILE_PATH="$RUNNER_TEMP/AppStore.mobileprovision"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | \
            /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin)
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          cp "$PROFILE_PATH" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"

      # Manuelles Signing (CODE_SIGN_STYLE=Manual) statt "Automatic":
      # Automatic Signing erfordert eine interaktive Xcode-/Apple-ID-Sitzung
      # und ist für einen headless CI-Runner nicht praktikabel bzw. nicht
      # deterministisch. Manuelles Signing mit vorab erzeugtem Zertifikat +
      # Profil ist der von Apple/GitHub für CI dokumentierte Standardweg.
      - name: Archive (xcodebuild)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: storeFrontend/ios/App
        run: |
          set -e
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            clean archive

      # ── Upload-Weg: bewusst NICHT `xcrun altool`. ──────────────────────
      # `altool` gilt seit Apples Xcode-13-Release-Notes als deprecated
      # ("Use Xcode or Transporter to upload builds to App Store Connect")
      # und ist in aktuellen Xcode-Versionen teils bereits entfernt bzw.
      # nicht mehr zuverlässig verfügbar. Der von Apple aktuell dokumentierte
      # nicht-interaktive CLI-Weg ist `xcodebuild -exportArchive` mit
      # `destination: upload` im ExportOptions.plist, kombiniert mit den
      # `-authenticationKey*`-Flags für den App Store Connect API Key. Das
      # ist derselbe Signing-/Transport-Mechanismus, den Xcode Organizer und
      # das Transporter-Tool intern verwenden – kein Drittanbieter-Tool
      # (fastlane o. Ä.) nötig.
      #
      # Zwei getrennte Export-Läufe aus demselben Archiv:
      #   (a) destination "export"  → lokales .ipa, nur als GitHub-Artifact
      #   (b) destination "upload"  → direkter Upload zu App Store Connect
      # ────────────────────────────────────────────────────────────────────

      - name: Write export options plist (local .ipa)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions-export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>ma.markt.app</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export .ipa (xcodebuild, local artifact only)
        run: |
          set -e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Verify .ipa exists
        run: |
          set -e
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "❌ Kein .ipa in $RUNNER_TEMP/export gefunden!"
            find "$RUNNER_TEMP/export" -type f
            exit 1
          fi
          echo "✅ IPA gefunden: $IPA ($(du -h "$IPA" | cut -f1))"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Upload .ipa artifact (GitHub Actions, zusätzlich zu TestFlight)
        uses: actions/upload-artifact@v4
        with:
          name: markt-ma-ios-release
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Write export options plist (App Store Connect upload)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions-upload.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>ma.markt.app</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Upload to App Store Connect (TestFlight)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -e
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > "$AUTH_KEY_PATH"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          rm -f "$AUTH_KEY_PATH"

      - name: Cleanup temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ci-signing.keychain-db" || true
