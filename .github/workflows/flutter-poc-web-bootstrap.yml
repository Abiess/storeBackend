name: Flutter PoC – Bootstrap Web Platform (one-time, self-removing)

# ──────────────────────────────────────────────────────────────────────────
# EINMALIGER, SELBST-ENTFERNENDER Bootstrap-Workflow.
#
# Zweck: mobile-flutter-poc/ hat bisher kein web/-Verzeichnis, weil lokal
# kein Flutter-SDK verfuegbar ist, um `flutter create --platforms=web`
# auszufuehren. Dieser Workflow tut GENAU DAS einmalig in CI.
#
# Anders als der Android-Bootstrap (flutter-poc-bootstrap.yml, dauerhaft im
# Repo belassen) soll dieser Workflow bewusst NICHT dauerhaft als Datei
# bestehen bleiben (explizite Vorgabe: kein unnoetiger permanenter
# Bootstrap-Workflow). Deshalb committet dieser Lauf das generierte web/
# UND loescht sich in genau diesem Commit selbst wieder.
#
# Ablauf:
#   1. flutter create --platforms=web (nur falls web/ noch nicht existiert)
#   2. Sanity-Check: pub get / analyze / test (muss weiterhin gruen sein)
#   3. git status (Diagnose, sichtbar im Workflow-Log, u.a. fuer Review ob
#      `flutter create` ausser web/ noch andere Root-Metadaten beruehrt hat)
#   4. Ein einziger Commit: fuegt mobile-flutter-poc/ Aenderungen (v.a. web/)
#      hinzu UND entfernt diese Workflow-Datei selbst.
#   5. Push auf den auslösenden Branch.
#
# Nach diesem einen Lauf existiert diese Datei nicht mehr im Repo - der
# normale .github/workflows/flutter-poc.yml Workflow uebernimmt danach
# dauerhaft analyze/test/build (Android + Web), ohne dass `flutter create`
# je wieder ausgefuehrt wird.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    paths:
      - '.github/workflows/flutter-poc-web-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter-poc

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Fail fast if web/ already exists
        run: |
          if [ -d "web" ]; then
            echo "❌ mobile-flutter-poc/web/ existiert bereits im Repo."
            echo "   Bootstrap ist nur fuer den EINMALIGEN Erstlauf gedacht."
            exit 1
          fi

      - name: Generate Web platform files
        run: flutter create --platforms=web --org ma.markt --project-name markt_ma_documents_poc .

      - name: Sanity-check generated project (pub get + analyze + test)
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Diagnose – zeige alle durch flutter create veraenderten Dateien
        run: |
          cd ..
          echo "── git status --porcelain (mobile-flutter-poc) ──"
          git status --porcelain -- mobile-flutter-poc

      - name: Commit web/ platform files and remove this bootstrap workflow
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Alles was `flutter create --platforms=web` innerhalb des Projekts
          # veraendert/erzeugt hat (in der Praxis: web/, ggf. .metadata).
          git add -A mobile-flutter-poc

          # Dieser Bootstrap-Workflow entfernt sich im selben Commit selbst.
          rm .github/workflows/flutter-poc-web-bootstrap.yml
          git add .github/workflows/flutter-poc-web-bootstrap.yml

          git commit -m "chore(flutter): bootstrap web platform via flutter create --platforms=web

          Automatisch erzeugt durch einen einmaligen, selbst-entfernenden
          CI-Bootstrap-Lauf (.github/workflows/flutter-poc-web-bootstrap.yml).
          Enthaelt ausschliesslich generierte mobile-flutter-poc/web/-
          Plattformdateien (und ggf. .metadata-Aktualisierung durch
          'flutter create'). android/, lib/, test/ und Shared-UI-Komponenten
          sind unveraendert.

          Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"

          git push origin HEAD:${{ github.ref_name }}
