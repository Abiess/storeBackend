name: Flutter PoC – Bootstrap Android Platform Files (one-time)

# ──────────────────────────────────────────────────────────────────────────
# EINMALIGER Bootstrap-Workflow - NUR manuell per "Run workflow" auszufuehren.
#
# Zweck: mobile-flutter-poc/ enthaelt bisher nur reinen Dart-Code (lib/,
# test/, pubspec.yaml) - lokal ist kein Flutter-SDK verfuegbar, um
# `flutter create --platforms=android` auszufuehren. Dieser Workflow tut
# GENAU DAS einmalig in CI und stellt das Ergebnis als Artifact bereit.
#
# WICHTIG - bewusste Trennung von Erzeugung und Commit:
#   Dieser Workflow committet NICHTS automatisch ins Repo. Er hat keine
#   Schreibrechte (kein `permissions: contents: write`, kein `git push`).
#   Ablauf ist:
#     1. Diesen Workflow einmalig per "Run workflow" (workflow_dispatch) starten.
#     2. Das erzeugte Artifact "flutter-poc-android-bootstrap" herunterladen.
#     3. Den Inhalt (android/, .metadata, analysis_options.yaml, .gitignore)
#        LOKAL nach mobile-flutter-poc/ entpacken.
#     4. Bewusst manuell `git add`/`git commit`/`git push` ausfuehren (Mensch
#        prueft/verantwortet den Commit, kein Bot-Auto-Commit).
#     5. Danach laeuft der normale .github/workflows/flutter-poc.yml
#        Workflow rein lesend/bauend (pub get/analyze/test/build/Artifact),
#        ohne dieses Skript je wieder auszufuehren.
#
# Nach erfolgreichem Bootstrap wird dieser Workflow nicht mehr benoetigt und
# kann bei Bedarf entfernt werden (bewusst nicht automatisch geloescht).
# ──────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  bootstrap-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter-poc

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Fail fast if android/ already exists
        run: |
          if [ -d "android" ]; then
            echo "❌ mobile-flutter-poc/android/ existiert bereits im Repo."
            echo "   Bootstrap ist nur fuer den EINMALIGEN Erstlauf gedacht."
            exit 1
          fi

      - name: Generate Android platform files
        run: flutter create --platforms=android --org ma.markt --project-name markt_ma_documents_poc .

      - name: Remove Flutter template default widget test
        run: |
          # `flutter create` adds test/widget_test.dart referencing the
          # template's default `MyApp` widget. This project already has a
          # real test suite (test/models_test.dart) and its own root widget
          # class, so the generated template test does not apply and is
          # removed here instead of being artificially adapted just to pass.
          if [ -f "test/widget_test.dart" ]; then
            echo "Removing generated Flutter template test/widget_test.dart"
            rm test/widget_test.dart
          fi

      - name: Sanity-check generated project (pub get + analyze + test)
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Upload generated Android platform files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-poc-android-bootstrap
          path: |
            mobile-flutter-poc/android/
            mobile-flutter-poc/.metadata
            mobile-flutter-poc/analysis_options.yaml
            mobile-flutter-poc/.gitignore
          if-no-files-found: error
          retention-days: 14
