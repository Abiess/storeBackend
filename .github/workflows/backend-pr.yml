name: Backend PR checks

on:
  pull_request:
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/db/migration/**'
      - 'scripts/db/migrations/**'
      - 'pom.xml'
      - '.github/workflows/backend-pr.yml'

jobs:
  cart-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test store-scoped carts and order history
        run: mvn -B -ntp -Dtest=CartServiceStoreScopeTest,PublicOrderCartStoreScopeTest,OrderTrackingStoreFilterTest,CustomerAppSessionServiceTest,OrderTrackingDetailsTest test
