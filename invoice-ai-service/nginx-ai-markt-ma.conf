# ══════════════════════════════════════════════════════════════
# Nginx-Konfiguration für ai.markt.ma
# ══════════════════════════════════════════════════════════════
# 
# Installieren:
#   sudo cp nginx-ai-markt-ma.conf /etc/nginx/sites-available/ai.markt.ma
#   sudo ln -s /etc/nginx/sites-available/ai.markt.ma /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Vorher: SSL-Zertifikat mit certbot erstellen!
#   sudo certbot --nginx -d ai.markt.ma
# ══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name ai.markt.ma;
    
    # Redirect zu HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai.markt.ma;
    
    # SSL-Zertifikate (certbot-managed)
    ssl_certificate /etc/letsencrypt/live/ai.markt.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.markt.ma/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    
    # Body Size (10 MB für PDF-Upload)
    client_max_body_size 10M;
    
    # Timeouts (2 Minuten für KI-Verarbeitung)
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    
    # Proxy zu FastAPI (127.0.0.1:8010)
    location /api/invoices/parse {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # KEINE Buffering (Stream-fähig)
        proxy_buffering off;
    }
    
    # Health Check (öffentlich)
    location /health {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Buffering ok (kleiner Response)
        proxy_buffering on;
    }
    
    # Alle anderen Pfade → 404
    location / {
        return 404;
    }
}
