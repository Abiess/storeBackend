# ══════════════════════════════════════════════════════════════
# Nginx-Konfiguration für flutter-dev.markt.ma (Flutter Web Preview)
# ══════════════════════════════════════════════════════════════
#
# Diese Datei wird NICHT automatisch von GitHub Actions installiert oder
# aktiviert. Sie ist ausschliesslich zur Referenz im Repository eingecheckt
# (analog zu invoice-ai-service/nginx-ai-markt-ma.conf) und muss von einem
# Menschen einmalig manuell auf dem VPS eingerichtet werden.
#
# WICHTIG: `server_name flutter-dev.markt.ma;` ist ein EXAKTER Server-Name.
# Nginx bevorzugt exakte server_name-Treffer gegenueber der bestehenden
# Regex-Wildcard aus scripts/setup-subdomain-support.sh
# (server_name ~^(?<subdomain>(?!api|www)[^.]+)\.markt\.ma$;), die sonst
# JEDE unbekannte Subdomain (inkl. flutter-dev) automatisch auf das
# Angular-Frontend (/var/www/markt.ma) routen wuerde. Mit diesem exakten
# Server-Block wird flutter-dev.markt.ma stattdessen korrekt auf den
# separaten Flutter-Web-Build ausgeliefert.
#
# Installieren (manuell, einmalig):
#   sudo cp mobile-flutter-poc/nginx-flutter-dev-markt-ma.conf \
#       /etc/nginx/sites-available/flutter-dev.markt.ma
#   sudo ln -s /etc/nginx/sites-available/flutter-dev.markt.ma \
#       /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Vorher: DNS A-Record fuer flutter-dev.markt.ma → VPS-IP anlegen, dann
# SSL-Zertifikat mit certbot erstellen:
#   sudo certbot --nginx -d flutter-dev.markt.ma
#
# Deployment-Ziel (siehe .github/workflows/deploy-flutter-web.yml):
#   /var/www/flutter-dev.markt.ma/current
# ══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name flutter-dev.markt.ma;

    # Redirect zu HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name flutter-dev.markt.ma;

    # SSL-Zertifikate (certbot-managed)
    ssl_certificate /etc/letsencrypt/live/flutter-dev.markt.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flutter-dev.markt.ma/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Document Root – ausschliesslich der Flutter-Web-Build, NICHT Angular
    root /var/www/flutter-dev.markt.ma/current;
    index index.html;

    # Cache-Control fuer statische Flutter-Web-Assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Flutter-Web ist eine SPA - alle unbekannten Pfade auf index.html
    # zurueckfallen lassen (Flutter-Router uebernimmt clientseitig).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
