version: '3.8'

services:
  # PaddleOCR FastAPI Mikroservice
  paddleocr-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paddleocr-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"  # Nur localhost (intern)
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2.0
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    volumes:
      - paddle-models:/root/.paddleocr  # Models cachen
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal

volumes:
  paddle-models:
    driver: local

networks:
  internal:
    driver: bridge
